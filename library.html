
<!DOCTYPE html>
<html>
<head>
    <title>Library Membership Form by Shojib</title>
</head>
<body>

    <h2>Library Membership Form</h2>

    <form>
        <label for="memberName">Member Name:</label>
        <input type="text" id="memberName" name="memberName">
        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label>Membership Type:</label>
        <input type="radio" id="basic" name="membership"
               value="Basic">
        <label for="basic">Basic</label>

        <input type="radio" id="premium" name="membership"
               value="Premium">
        <label for="premium">Premium</label>
        <br><br>

        <label>Preferred Genres:</label>
        <br>

        <input type="checkbox" id="fiction" name="genres"
               value="Fiction">
        <label for="fiction">Fiction</label>
        <br>

        <input type="checkbox" id="science" name="genres"
               value="Science">
        <label for="science">Science</label>
        <br>

        <input type="checkbox" id="history" name="genres"
               value="History">
        <label for="history">History</label>
        <br><br>

        <label for="notes">Notes:</label>
        <br>
        <textarea id="notes" name="notes"
                  rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Join Now">
    </form>

</body>
</html>
